<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MacRecorder 탭 녹화 — 마이크 허용</title>
<link rel="stylesheet" href="popup.css">
<style>body { width: auto; max-width: 520px; margin: 40px auto; padding: 0 20px; font-size: 14px; } button.primary { width: auto; }</style>
</head>
<body>
  <h1 style="font-size:18px">마이크 허용</h1>
  <p>탭을 녹화할 때 마이크(내 목소리)도 같이 녹음하려면 이 확장에 마이크 권한이 필요합니다. 아래 버튼을 누르고 브라우저가 묻는 창에서 «허용»을 눌러 주세요. 한 번만 하면 됩니다.</p>
  <button id="allow" class="primary">마이크 허용</button>
  <p id="msg"></p>
  <ul id="devs"></ul>
  <p class="small">macOS 가 브라우저의 마이크 사용을 막고 있으면 시스템 설정 → 개인정보 보호 및 보안 → 마이크에서 이 브라우저를 켜 주세요.</p>
  <script type="module" src="permission.js"></script>
</body>
</html>
